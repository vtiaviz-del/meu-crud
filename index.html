<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento de Produtos</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; color: #333; }
    h1 { margin-bottom: 20px; }
    
    /* Disposição vertical em 100% da largura */
    .container { display: flex; flex-direction: column; gap: 20px; width: 100%; }
    
    /* Formulário ocupando a largura total */
    form { 
      background: #fff; 
      padding: 20px; 
      border-radius: 8px; 
      width: 100%; 
      max-width: 100%; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
    }
    
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    
    .btn-group { display: flex; gap: 10px; }
    button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
    .btn-submit { background-color: #28a745; color: white; }
    .btn-cancel { background-color: #6c757d; color: white; display: none; }
    
    /* Tabela ocupando a largura total */
    .table-container { width: 100%; }
    table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background-color: #007bff; color: white; }
    tr:hover { background-color: #f1f1f1; }
    
    .btn-edit { background-color: #ffc107; color: #212529; padding: 6px 10px; }
    .btn-delete { background-color: #dc3545; color: white; padding: 6px 10px; }
    #loading { font-weight: bold; color: #007bff; margin-bottom: 15px; display: none; }
  </style>
</head>
<body>

  <h1>Gerenciamento de Produtos</h1>
  <div id="loading">Carregando dados, aguarde...</div>

  <div class="container">
    <!-- Formulário -->
    <form id="productForm">
      <h2 id="formTitle">Novo Produto</h2>
      <input type="hidden" id="productId">
      
      <div class="input-group">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required placeholder="Ex: Teclado Mecânico">
      </div>

      <div class="input-group">
        <label for="preco">Preço (R$):</label>
        <input type="number" step="0.01" id="preco" required placeholder="Ex: 250.00">
      </div>

      <div class="input-group">
        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" required placeholder="Ex: 15">
      </div>

      <div class="btn-group">
        <button type="submit" class="btn-submit" id="btnSave">Salvar</button>
        <button type="button" class="btn-cancel" id="btnCancel" onclick="resetForm()">Cancelar</button>
      </div>
    </form>

    <!-- Tabela de Exibição -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Preço</th>
            <th>Quantidade</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="productTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
